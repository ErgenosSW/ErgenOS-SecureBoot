name: Release package

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*-*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate release tag
        shell: bash
        run: |
          release="${RELEASE_TAG#v}"
          [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[A-Za-z0-9]+)*-[1-9][0-9]*$ ]]
      - name: Check Python syntax
        run: python -m py_compile ergenos_secureboot.py test_ergenos_secureboot.py
      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest -v test_ergenos_secureboot.py

  package:
    name: Build unsigned Arch package
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git pacman-contrib sudo
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Configure signed ErgenOS repository
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/ErgenosSW/ErgenOS-Repo/main/keys/ergenos.asc \
            --output /tmp/ergenos.asc
          fingerprint=$(gpg --batch --show-keys --with-colons /tmp/ergenos.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 28F9539131BC392DAF4099C595FE7988F432AFDA
          pacman-key --init
          pacman-key --add /tmp/ergenos.asc
          pacman-key --lsign-key "$fingerprint"
          printf '\n[ergenos]\nSigLevel = Required\nServer = https://ergenossw.github.io/ErgenOS-Repo/$arch\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm
      - name: Create build user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Apply version from release tag
        shell: bash
        run: |
          release="${RELEASE_TAG#v}"
          pkgrel="${release##*-}"
          pkgver="${release%-*}"
          sed -i "s/^pkgver=.*/pkgver=$pkgver/; s/^pkgrel=.*/pkgrel=$pkgrel/" PKGBUILD
          sudo -u builder updpkgsums
      - name: Build unsigned package
        run: sudo -u builder makepkg --syncdeps --noconfirm --needed --nocheck
      - name: Inspect package
        shell: bash
        run: |
          package=$(find . -maxdepth 1 -type f -name '*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          test -n "$package"
          pacman -Qip "$package"
          mkdir -p artifacts
          cp "$package" artifacts/
      - uses: actions/upload-artifact@v6
        with:
          name: ergenos-secureboot-${{ env.RELEASE_TAG }}-arch-package
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error
